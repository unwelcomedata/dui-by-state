project_name: "dui-by-state"

paths:
  data_raw:       data/raw        # downloaded source files, never modified
  data_interim:   data/interim    # intermediate cleaned/joined tables
  data_processed: data/processed  # final analysis-ready tables
  export:         export          # sellable dataset packages (csv, xlsx, parquet)
  outputs:        outputs         # chart images (exploratory)
  outputs_social: outputs/social  # publication-ready social media charts
  notebooks:      notebooks

settings:
  encoding: utf-8
  parquet_engine: pyarrow
  duckdb_file: data/project.duckdb   # single file DB for the project

sources:

  # ── State reference ────────────────────────────────────────────────────────
  # Census Population Estimates 2023 via API (needed for per-capita fatality rates)
  population:
    url: https://api.census.gov/data/2023/pep/population?get=NAME,POP_2023&for=state:*
    type: json
    notes: "Returns JSON array. Row 0 is header. Filter out territories after load."

  # ── NHTSA fatalities ────────────────────────────────────────────────────────
  # Full FARS 2024 national CSV zip — accident-level data, filter to alcohol crashes
  fars_2024:
    url: https://static.nhtsa.gov/nhtsa/downloads/FARS/2024/National/FARS2024NationalCSV.zip
    type: zip_csv
    target_file: accident.CSV
    notes: "DRUNK_DR > 0 flags alcohol-involved crash. STATE is FIPS numeric."

  # Pre-aggregated NHTSA Traffic Safety Facts — state-level summary table (2024)
  # This is the PDF that has the clean 52-row table; we scrape the HTML version
  nhtsa_state_summary_2024:
    url: https://crashstats.nhtsa.dot.gov/Api/Public/ViewPublication/813813
    type: pdf_table
    notes: "2024 State Alcohol-Impaired-Driving Estimates. Manual step if PDF scrape fails."

  # ── DUI laws & penalties ───────────────────────────────────────────────────
  dui_laws_ncsl:
    url: https://www.ncsl.org/transportation/dui-dwi-per-se-laws
    type: html_table
    table_index: 0
    js_render: false
    notes: "NCSL per se BAC laws by state. Most authoritative legislative source."

  dui_penalties_roadlaw:
    url: https://roadlawguide.com/dui-dwi-laws/penalties-by-state/
    type: html_scrape
    js_render: false
    notes: "Structured penalty table per state: jail, fine, suspension, IID, felony threshold."

  # ── BAC testing & enforcement procedures ───────────────────────────────────
  bac_testing_laws:
    url: https://rosap.ntl.bts.gov/view/dot/1940
    type: hand_curated
    notes: "Mandatory BAC testing laws by state. Based on Casanova 2012 (DOT HS 811 661) + current state statutes. File: data/raw/bac_testing_laws.csv"

  fars_bac_testing_2024:
    url: https://static.nhtsa.gov/nhtsa/downloads/FARS/2024/National/FARS2024NationalCSV.zip
    type: computed
    target_file: person.csv
    notes: "BAC testing rates by state computed from person.csv ALC_STATUS field. Pct known BAC for killed vs surviving drivers."

  nasid_enforcement:
    url: https://nasid.org/state/{state-slug}/
    type: html_scrape
    js_render: false
    notes: "NASID state enforcement law pages. 12 fields per state: checkpoints, IID, no-refusal, PBT, lookback, felony, high-BAC, testing methods, open container, ALS/ALR, social host."

  # ── Vehicle sanctions ──────────────────────────────────────────────────────
  vehicle_impound_laws:
    url: https://www.nhtsa.gov/book/countermeasures-that-work/alcohol-impaired-driving/countermeasures/other-strategies-behavior-5
    type: hand_curated
    notes: "Vehicle impound/immobilization/forfeiture laws by state. Compiled from NHTSA DOT HS 811 028B (2008), NHTSA Countermeasures That Work (2023), CDC MV PICCS, and current state statutes. File: data/raw/vehicle_impound_laws.csv"

export:
  formats:
    - csv
    - xlsx
    - parquet
  include_codebook: true
  strip_pii_columns: []
